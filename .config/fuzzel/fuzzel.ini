# ==============================================================================
# Fuzzel Configuration - Defqon.1 Weekend Warrior (Industrial Dark)
# ==============================================================================

[main]
font=MesloLGS Nerd Font:size=12
prompt="❯ "
placeholder="buscar comando o aplicación..."
icon-theme=Papirus-Dark
icons-enabled=yes
show-actions=no
terminal=foot -e
lines=12
width=55
tabs=4
horizontal-pad=18
vertical-pad=12
inner-pad=8
line-height=24
dpi-aware=auto

[border]
width=1
radius=0

[colors]
background=121317fa
text=e4e5e8ff
prompt=e05561ff
placeholder=6c7280ff
input=e4e5e8ff
match=eb6f7bff
selection=242731ff
selection-text=f38d41ff
selection-match=ff6b6bff
border=e05561ff

[key-bindings]
cancel=Escape Control+c Control+bracketleft
execute=Return KP_Enter Control+y
execute-or-next=Tab
cursor-left=Left Control+b
cursor-right=Right Control+f
cursor-home=Home Control+a
cursor-end=End Control+e
prev=Up Control+k Control+p
next=Down Control+j Control+n
prev-page=Page_Up Control+u
next-page=Page_Down Control+d
