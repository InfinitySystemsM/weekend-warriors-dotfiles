# ==============================================================================
# Fuzzel Configuration - Defqon.1 Weekend Warrior (Industrial Dark)
# ==============================================================================

[main]
font=Terminess Nerd Font:size=18
prompt="❯ "
placeholder="buscar comando o aplicación..."
icon-theme=Papirus-Dark
icons-enabled=yes
show-actions=no
terminal=foot -e
lines=12
width=55
tabs=4
horizontal-pad=18
vertical-pad=12
inner-pad=8
line-height=36
dpi-aware=no

[border]
width=2
radius=0

[colors]
background=0e1015fa
text=f1f5f9ff
prompt=dc2626ff
placeholder=64748bff
input=f1f5f9ff
match=ef4444ff
selection=242733ff
selection-text=f59e0bff
selection-match=f97316ff
border=dc2626ff

[key-bindings]
cancel=Escape Control+c Control+bracketleft
execute=Return KP_Enter Control+y
execute-or-next=Tab
cursor-left=Left Control+b
cursor-right=Right Control+f
cursor-home=Home Control+a
cursor-end=End Control+e
delete-line-forward=none
delete-line-backward=none
delete-next=none
prev=Up Control+k Control+p
next=Down Control+j Control+n
prev-page=Page_Up Control+u
next-page=Page_Down Control+d
