# ==============================================================================
# Fuzzel Configuration - TUI / Console Aesthetic (Catppuccin Mocha)
# ==============================================================================

[main]
font=MesloLGS Nerd Font:size=12
prompt="❯ "
placeholder="buscar comando o aplicación..."
icon-theme=Papirus-Dark
icons-enabled=yes
show-actions=no
terminal=foot -e
lines=12
width=55
tabs=4
horizontal-pad=18
vertical-pad=12
inner-pad=8
line-height=24
dpi-aware=auto

[border]
width=1
radius=0

[colors]
background=1e1e2eff
text=cdd6f4ff
prompt=cba6f7ff
placeholder=6c7086ff
input=cdd6f4ff
match=f38ba8ff
selection=313244ff
selection-text=89b4faff
selection-match=f9e2afff
border=cba6f7ff

[key-bindings]
cancel=Escape Control+c Control+bracketleft
execute=Return KP_Enter Control+y
execute-or-next=Tab
cursor-left=Left Control+b
cursor-right=Right Control+f
cursor-home=Home Control+a
cursor-end=End Control+e
prev=Up Control+k Control+p
next=Down Control+j Control+n
prev-page=Page_Up Control+u
next-page=Page_Down Control+d
