# ==============================================================================
# Starship Prompt - Defqon.1 Weekend Warrior (Industrial Dark)
# ==============================================================================

format = """
$directory\
$git_branch\
$git_status\
$package\
$rust\
$golang\
$nodejs\
$python\
$docker_context\
$cmd_duration\
$line_break\
$character"""

palette = "defqon1"

[character]
success_symbol = "[❯](bold #e05561)"
error_symbol = "[❯](bold #ff4757)"
vicmd_symbol = "[❮](bold #8ebd6b)"

[directory]
style = "bold #56b6c2"
format = "[$path]($style) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = "󰘬 "
style = "bold #f38d41"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold #e05561"
format = "([$all_status$ahead_behind]($style) )"

[cmd_duration]
min_time = 2_000
style = "bold #e5c07b"
format = "[ $duration]($style) "

[package]
symbol = "󰏗 "
style = "bold #f38d41"
format = "[$symbol$version]($style) "

[rust]
symbol = " "
style = "bold #e05561"
format = "[$symbol($version )]($style)"

[golang]
symbol = " "
style = "bold #56b6c2"
format = "[$symbol($version )]($style)"

[nodejs]
symbol = " "
style = "bold #8ebd6b"
format = "[$symbol($version )]($style)"

[python]
symbol = " "
style = "bold #e5c07b"
format = "[$symbol($version )]($style)"

[docker_context]
symbol = " "
style = "bold #61afef"
format = "[$symbol$context]($style) "

[palettes.defqon1]
base = "#121317"
surface = "#181a20"
border = "#2d313d"
text = "#e4e5e8"
subtext = "#7d8597"
red = "#e05561"
orange = "#f38d41"
yellow = "#e5c07b"
green = "#8ebd6b"
cyan = "#56b6c2"
blue = "#61afef"
