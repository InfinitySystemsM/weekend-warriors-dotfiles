# ==============================================================================
# Starship Prompt - Defqon.1 Weekend Warrior (Industrial Dark)
# ==============================================================================

format = """
$directory\
$git_branch\
$git_status\
$package\
$rust\
$golang\
$nodejs\
$python\
$docker_context\
$cmd_duration\
$line_break\
$character"""

palette = "defqon1"

[character]
success_symbol = "[❯](bold #dc2626)"
error_symbol = "[❯](bold #ef4444)"
vicmd_symbol = "[❮](bold #84cc16)"

[directory]
style = "bold #06b6d4"
format = "[$path]($style) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = "󰘬 "
style = "bold #f97316"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold #dc2626"
format = "([$all_status$ahead_behind]($style) )"

[cmd_duration]
min_time = 2_000
style = "bold #f59e0b"
format = "[ $duration]($style) "

[package]
symbol = "󰏗 "
style = "bold #f97316"
format = "[$symbol$version]($style) "

[rust]
symbol = " "
style = "bold #dc2626"
format = "[$symbol($version )]($style)"

[golang]
symbol = " "
style = "bold #06b6d4"
format = "[$symbol($version )]($style)"

[nodejs]
symbol = " "
style = "bold #84cc16"
format = "[$symbol($version )]($style)"

[python]
symbol = " "
style = "bold #f59e0b"
format = "[$symbol($version )]($style)"

[docker_context]
symbol = " "
style = "bold #38bdf8"
format = "[$symbol$context]($style) "

[palettes.defqon1]
base = "#0e1015"
surface = "#151821"
border = "#282c37"
text = "#f1f5f9"
subtext = "#7d8597"
red = "#dc2626"
orange = "#f97316"
yellow = "#f59e0b"
green = "#84cc16"
cyan = "#06b6d4"
blue = "#38bdf8"
