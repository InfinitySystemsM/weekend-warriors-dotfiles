# ==============================================================================
# Foot Terminal Configuration - Catppuccin Mocha TUI Edition
# ==============================================================================

[main]
term=foot
font=MesloLGS Nerd Font:size=10, DejaVu Sans Mono:size=10
font-bold=MesloLGS Nerd Font:size=10:weight=bold
font-italic=MesloLGS Nerd Font:size=10:slant=italic
font-bold-italic=MesloLGS Nerd Font:size=10:weight=bold:slant=italic
pad=12x12 center
dpi-aware=yes
title=Terminal

[scrollback]
lines=10000
multiplier=3.0

[cursor]
style=block
blink=no

[colors-dark]
alpha=0.95
foreground=cdd6f4
background=1e1e2e
cursor=1e1e2e cdd6f4

## Normal/Regular Colors
regular0=45475a  # surface1 (black)
regular1=f38ba8  # red
regular2=a6e3a1  # green
regular3=f9e2af  # yellow
regular4=89b4fa  # blue
regular5=f5c2e7  # pink
regular6=94e2d5  # teal
regular7=bac2de  # subtext1 (white)

## Bright Colors
bright0=585b70   # surface2 (bright black)
bright1=f38ba8   # bright red
bright2=a6e3a1   # bright green
bright3=f9e2af   # bright yellow
bright4=89b4fa   # bright blue
bright5=f5c2e7   # bright pink
bright6=94e2d5   # bright teal
bright7=a6adc8   # subtext0 (bright white)

## Selection Colors
selection-foreground=cdd6f4
selection-background=45475a

## Search Colors
search-box-no-match=11111b f38ba8
search-box-match=cdd6f4 313244

## Jump Labels
jump-labels=11111b fab387

[csd]
preferred=server
size=0
border-width=0
