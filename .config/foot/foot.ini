# ==============================================================================
# Foot Terminal Configuration - Defqon.1 Weekend Warrior (Industrial Dark)
# ==============================================================================

[main]
term=foot
font=Terminess Nerd Font:size=11, MesloLGS Nerd Font:size=10
font-bold=MesloLGS Nerd Font:size=10:weight=bold
font-italic=MesloLGS Nerd Font:size=10:slant=italic
font-bold-italic=MesloLGS Nerd Font:size=10:weight=bold:slant=italic
pad=12x12 center
dpi-aware=yes
title=Terminal

[scrollback]
lines=10000
multiplier=3.0

[cursor]
style=block
blink=no

[colors-dark]
alpha=0.95
foreground=e4e5e8
background=121317
cursor=121317 e4e5e8

## Normal/Regular Colors (Industrial Metals & Stage Lasers)
regular0=282b35  # industrial black / charcoal
regular1=e05561  # warrior red
regular2=8ebd6b  # laser green
regular3=e5c07b  # hazard gold
regular4=61afef  # stage laser blue
regular5=d19a66  # flame amber
regular6=56b6c2  # stage laser cyan
regular7=abb2bf  # steel muted white

## Bright Colors
bright0=3e4451   # bright charcoal
bright1=eb6f7b   # bright crimson
bright2=9ece6a   # bright laser green
bright3=f38d41   # bright amber flame
bright4=7aa2f7   # bright blue
bright5=ff6b6b   # bright flame
bright6=7dcfff   # bright laser cyan
bright7=e4e5e8   # pure chalk white

## Selection Colors
selection-foreground=e4e5e8
selection-background=2d313d

## Search Colors
search-box-no-match=0f1013 ff4757
search-box-match=e4e5e8 282b35

## Jump Labels
jump-labels=0f1013 f38d41

[csd]
preferred=server
size=0
border-width=0
