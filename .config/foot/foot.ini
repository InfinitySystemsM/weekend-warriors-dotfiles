# ==============================================================================
# Foot Terminal Configuration - Defqon.1 Weekend Warrior (Industrial Dark)
# ==============================================================================

[main]
term=foot
font=Terminess Nerd Font:size=16, MesloLGS Nerd Font:size=14.5
font-bold=MesloLGS Nerd Font:size=14.5:weight=bold
font-italic=MesloLGS Nerd Font:size=14.5:slant=italic
font-bold-italic=MesloLGS Nerd Font:size=14.5:weight=bold:slant=italic
pad=12x12 center
dpi-aware=no
title=Terminal

[scrollback]
lines=10000
multiplier=3.0

[cursor]
style=block
blink=no

[colors-dark]
alpha=0.95
foreground=f1f5f9
background=0e1015
cursor=0e1015 f1f5f9

## Normal/Regular Colors (Defqon.1 RED Stage: Flame & Obsidian Steel)
regular0=282c37  # industrial dark steel
regular1=dc2626  # defqon red
regular2=84cc16  # laser green
regular3=f59e0b  # solar gold
regular4=38bdf8  # stage laser blue
regular5=f97316  # pyro orange
regular6=06b6d4  # stage laser cyan
regular7=cbd5e1  # steel muted white

## Bright Colors
bright0=3e4451   # bright charcoal
bright1=ef4444   # bright crimson flare
bright2=a3e635   # bright laser green
bright3=fbbf24   # bright flame gold
bright4=60a5fa   # bright electric blue
bright5=ff5722   # bright pyro flame
bright6=22d3ee   # bright laser cyan
bright7=f8fafc   # incandescent chalk white

## Selection Colors
selection-foreground=f1f5f9
selection-background=282c37

## Search Colors
search-box-no-match=0e1015 ef4444
search-box-match=f1f5f9 282c37

## Jump Labels
jump-labels=0e1015 f97316

[csd]
preferred=server
size=0
border-width=0
