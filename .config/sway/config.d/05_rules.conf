# ==============================================================================
# Window Rules & Floating Dialogs
# ==============================================================================

# Dialogs and Popups
for_window [window_role="pop-up"] floating enable
for_window [window_role="bubble"] floating enable
for_window [window_role="dialog"] floating enable
for_window [window_type="dialog"] floating enable
for_window [window_role="task_dialog"] floating enable
for_window [window_role="Preferences"] floating enable
for_window [app_id="org.gnome.FileRoller"] floating enable
for_window [app_id="pavucontrol"] floating enable, resize set width 65 ppt height 65 ppt, move position center
for_window [app_id="blueman-manager"] floating enable, resize set width 60 ppt height 60 ppt, move position center
for_window [app_id="thunar" window_role="Properties"] floating enable
for_window [app_id="thunar" title=".*File Operation.*"] floating enable
for_window [app_id="thunar" title=".*Operación de archivo.*"] floating enable
for_window [app_id="swappy"] floating enable
for_window [title="Picture-in-Picture"] floating enable, sticky enable
for_window [app_id="(?i)firefox" title=".*(Choose.*profile|Seleccionar.*perfil|Elegir.*perfil|Profile.*Manager|Gestor.*perfiles).*"] floating enable, resize set width 65 ppt height 70 ppt, move position center
for_window [class="(?i)firefox" title=".*(Choose.*profile|Seleccionar.*perfil|Elegir.*perfil|Profile.*Manager|Gestor.*perfiles).*"] floating enable, resize set width 65 ppt height 70 ppt, move position center
for_window [class="(?i)firefox" window_role="ProfileManager"] floating enable, resize set width 65 ppt height 70 ppt, move position center



# Responsive TUI Tools Floating Rules (Percentage-based for multi-monitor scaling)
for_window [app_id="tui-pulsemixer"] floating enable, resize set width 65 ppt height 65 ppt, move position center
for_window [app_id="tui-btop"] floating enable, resize set width 75 ppt height 75 ppt, move position center
for_window [app_id="tui-nmtui"] floating enable, resize set width 55 ppt height 60 ppt, move position center
for_window [app_id="tui-lazygit"] floating enable, resize set width 80 ppt height 80 ppt, move position center
for_window [app_id="tui-bluetui"] floating enable, resize set width 60 ppt height 60 ppt, move position center
for_window [app_id="tui-updates"] floating enable, resize set width 65 ppt height 65 ppt, move position center
for_window [app_id="tui-packages"] floating enable, resize set width 80 ppt height 80 ppt, move position center
for_window [app_id="tui-calendar"] floating enable, resize set width 52 ppt height 60 ppt, move position center
for_window [app_id="tui-scratchpad"] floating enable, resize set width 70 ppt height 70 ppt, move position center
for_window [app_id="tui-dotwave"] floating enable, resize set width 65 ppt height 40 ppt, move position center
for_window [app_id="tui-sampledeck"] floating enable, resize set width 75 ppt height 55 ppt, move position center

# Inhibit idle for fullscreen apps
for_window [app_id=".*"] inhibit_idle fullscreen

# TuiCast Studio TUI & Multiview Window Rules
for_window [app_id="tui-tuicast"] floating enable, resize set width 85 ppt height 85 ppt, move position center
for_window [app_id="tuicast-multiview"] floating enable, resize set width 1280 px height 720 px, move position center
for_window [app_id="tuicast-program"] floating enable, resize set width 1280 px height 720 px, move position center
for_window [app_id="tuicast.*"] inhibit_idle visible

