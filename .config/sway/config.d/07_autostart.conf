# ==============================================================================
# Autostart Services & Daemons
# ==============================================================================

# Systemd & D-Bus Environment
exec dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=sway GTK_THEME="adw-gtk3-dark" ADW_DEBUG_COLOR_SCHEME="prefer-dark" QT_QPA_PLATFORMTHEME="qt5ct" QT_QPA_PLATFORM="wayland;xcb" QT_WAYLAND_DISABLE_WINDOWDECORATION="1"
exec systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP GTK_THEME ADW_DEBUG_COLOR_SCHEME QT_QPA_PLATFORMTHEME QT_QPA_PLATFORM QT_WAYLAND_DISABLE_WINDOWDECORATION

# XSettings Daemon for GTK / X11 / Qt theme syncing (if installed)
exec sh -c 'command -v xsettingsd >/dev/null 2>&1 && exec xsettingsd'

# Polkit Authentication Agent
exec /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# Notification Daemon (Mako)
exec mako

# Clipboard History Daemons (Cliphist)
exec wl-paste --type text --watch cliphist store
exec wl-paste --type image --watch cliphist store

# Idle & Screen Locker
exec swayidle -w \
    timeout 30 'pgrep -x swaylock && swaymsg "output * power off"' \
    resume 'swaymsg "output * power on"' \
    timeout 120 'pgrep -x swaylock && systemctl suspend' \
    timeout 300 'swaylock -f' \
    timeout 330 'pgrep -x swaylock && swaymsg "output * power off"' \
    timeout 420 'pgrep -x swaylock && systemctl suspend' \
    before-sleep 'swaylock -f' \
    lock 'swaylock -f'

# Dark Mode, Icons and Theme Preferences
exec gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'
exec gsettings set org.gnome.desktop.interface gtk-theme 'adw-gtk3-dark'
exec gsettings set org.gnome.desktop.interface icon-theme 'Papirus-Dark'
exec gsettings set org.gnome.desktop.interface font-name 'MesloLGS Nerd Font 10'
exec gsettings set org.gnome.desktop.interface cursor-theme 'Adwaita'
