# ==============================================================================
# Scratchpads & Quick TUI Popups
# ==============================================================================

# Quick Floating TUI Bindings
bindsym $mod+m exec foot --app-id=tui-pulsemixer -e pulsemixer
bindsym $mod+Shift+b exec foot --app-id=tui-btop -e btop
bindsym $mod+Shift+n exec foot --app-id=tui-nmtui -e nmtui
bindsym $mod+Shift+g exec foot --app-id=tui-lazygit -e lazygit
bindsym $mod+Shift+t exec foot --app-id=tui-bluetui -e bluetui
bindsym $mod+i exec foot --app-id=tui-packages -e tui-packages
bindsym $mod+c exec foot --app-id=tui-calendar -e tui-calendar
bindsym $mod+Shift+w exec fuzzel-wifi
bindsym $mod+Shift+Return exec foot --app-id=tui-scratchpad

# General Sway Scratchpad Management
bindsym $mod+Shift+minus move scratchpad
bindsym $mod+minus scratchpad show

# TuiCast Quick Floating Scratchpad ($mod+Shift+v)
bindsym $mod+Shift+v exec foot --app-id=tui-tuicast -e tuicast

