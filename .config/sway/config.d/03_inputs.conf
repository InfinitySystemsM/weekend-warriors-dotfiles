# ==============================================================================
# Input Configuration (Keyboard, Touchpad, Pointer)
# ==============================================================================

input type:touchpad {
    dwt enabled
    tap enabled
    tap_button_map lrm
    natural_scroll enabled
    middle_emulation enabled
    scroll_method two_finger
    accel_profile adaptive
    pointer_accel 0.2
}

# Lenovo ThinkPad TrackPoint (Physical Red Point & Middle Button Scroll)
input "*TrackPoint*" {
    accel_profile adaptive
    pointer_accel 0.15
    natural_scroll disabled
    middle_emulation disabled
    scroll_method on_button_down
    scroll_button button2
}

input type:keyboard {
    # US International with AltGr Dead Keys
    xkb_layout "us"
    xkb_variant "altgr-intl"
    repeat_delay 250
    repeat_rate 35
}

# Touchpad Gestures (Sway 1.8+ / Laptop)
bindgesture swipe:3:right workspace prev
bindgesture swipe:3:left workspace next
bindgesture swipe:4:right workspace prev
bindgesture swipe:4:left workspace next
bindgesture swipe:3:up fullscreen toggle
bindgesture pinch:3:inward+down move scratchpad
bindgesture pinch:3:outward+up scratchpad show
