# ==============================================================================
# Ly Display Manager Configuration - Defqon.1 "Weekend Warrior" Edition
# ==============================================================================

# Active Animation (none, matrix, doom, colormix, gameoflife)
animation = matrix
animation_frame_delay = 5
animation_timeout_sec = 0

# CMatrix Animation Colors (Defqon.1 Warrior Red & Amber)
cmatrix_fg = 0x00E05561
cmatrix_head_col = 0x01F38D41
cmatrix_min_codepoint = 0x21
cmatrix_max_codepoint = 0x7B

# Big ASCII Digital Clock at top
bigclock = en
bigclock_12hr = false
bigclock_seconds = false
clock = %a %d %b %H:%M

# Window Box Title & Appearance
box_title = DEFQON.1 • WEEKEND WARRIOR
blank_box = true
border_fg = 0x00E05561
fg = 0x00E4E5E8
bg = 0x00000000

# Error Colors (Laser Red)
error_fg = 0x01FF4757
error_bg = 0x00000000

# Password Mask & Input
asterisk = •
clear_password = true
default_input = password
input_len = 34

# Session & User Memory
save = true
auto_login_user = null
auto_login_session = null

# Layout & Margins
margin_box_h = 2
margin_box_v = 1
text_in_center = true
hide_borders = false
hide_key_hints = false
show_tty = false

# Keybindings
shutdown_key = F1
restart_key = F2
sleep_key = F3
brightness_down_key = F5
brightness_up_key = F6
show_password_key = F7

# Commands
restart_cmd = /sbin/shutdown -r now
shutdown_cmd = /sbin/shutdown -a now
brightness_down_cmd = /usr/bin/brightnessctl -q -n s 10%-
brightness_up_cmd = /usr/bin/brightnessctl -q -n s +10%

# Sessions Paths
waylandsessions = /usr/share/wayland-sessions
xsessions = /usr/share/xsessions
service_name = ly
setup_cmd = /etc/ly/setup.sh
ly_log = /var/log/ly.log
